# VoiceShield Canonical Default Configuration
# Strict contracts: 16 kHz mono, 4.0-second windows, 1.0-second streaming hops

audio:
  sample_rate: 16000
  channels: 1
  dtype: "float32"
  normalize_range:
    - -1.0
    - 1.0

windowing:
  window_seconds: 4.0
  hop_seconds: 1.0
  min_speech_seconds: 0.8
  energy_threshold: 0.015

model:
  model_id: "clovaai/aasist-l"
  architecture: "aasist_l"
  checkpoint_path: "models/weights/AASIST-L.pth"
  device_preferred: "mps"
  fallback_to_cpu: true

temporal_policy:
  threshold_high: 0.65
  threshold_low: 0.35
  smoothing_method: "ewma"
  ewma_alpha: 0.3
  median_window_size: 5
  elevation_n: 3
  elevation_m: 5
  hysteresis_consecutive_drops: 3
  timing_gap_threshold_seconds: 0.25

evaluation:
  dcf:
    c_miss: 1.0
    c_fa: 10.0
    p_target: 0.05
  target_tpr_levels:
    - 0.90
    - 0.95
    - 0.99
  bootstrap_iterations: 500
  bootstrap_ci_level: 0.95
  ece_num_bins: 10
