remaining_blockers:
- No public content-level licence or equivalent authoritative permission has been established for all spoof and
  adversarial audio files.
- The exact A17, A28, and A29 versions, checkpoint terms, output restrictions, and any separate licences are unknown.
- Qualified review of ODC-By, CC BY, model-output terms, jurisdiction, privacy, personality, voice, and possible
  biometric obligations has not occurred.
- It is not confirmed which historic Phase 2 rules remain binding for direct post-challenge research.
- Partition-wide term compatibility and the exact required attribution and Produced Work notice are not confirmed.
recommended_disposition: defer_pending_conditions
proposed_restrictions_if_later_approved:
- Authorize only a segregated, non-product Track 1 research-evaluation workflow for an existing detector; do not
  infer authorization for Track 2 speaker verification.
- Do not authorize training, fine-tuning, calibration, threshold freezing, product evaluation, product use, hosted-service
  use, or raw redistribution under this decision.
- Ingest only required audio, trial keys, bona fide/spoof labels, attack and codec tags needed for stratified error
  analysis, and integrity metadata.
- Hash or remap speaker identifiers solely for leakage prevention; exclude gender and any metadata not required
  for the approved evaluation.
- Prohibit identity inference, speaker search, contributor matching, voiceprint enrolment, demographic analysis,
  target-speaker analysis, and retention of reusable speaker embeddings.
- Keep raw bytes in access-controlled research storage; publish only aggregate metrics and approved notices, never
  clips, transcripts, protocols, or row-level scores that enable linkage.
- Preserve exact ODC-By, CC BY, source, attribution, citation, and any model-output notices required by the qualified
  decision.
- Require deletion and incident-response controls and a fresh rights review before any purpose, partition, artifact,
  jurisdiction, or distribution boundary changes.
next_review_action: Have a qualified human reviewer assess this packet and approve or revise the maintainer-question
  draft before any contact. If a response is later obtained, capture it immutably and re-run the non-authorizing
  review. Do not acquire data or change the registry.
