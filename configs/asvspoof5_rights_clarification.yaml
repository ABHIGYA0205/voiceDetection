verified_facts:
- statement_id: vf_release_record
  statement: Zenodo record 14498691 identifies ASVspoof 5 release v0.1 as a dataset, published 2024-12-18 under
    the declared ODC-By licence. The captured API record was revision 6, updated 2025-02-14, and exposes direct
    public file links.
  source_ids:
  - zenodo_record_14498691_api
- statement_id: vf_database_and_bonafide_terms
  statement: The official README states that the database may be used under ODC-By and separately states that the
    bona fide data is distributed under CC BY 4.0.
  source_ids:
  - zenodo_readme_14498691
  - zenodo_license_14498691
  - cc_by_4_0_legal_code
  - odc_by_1_0_legal_code
- statement_id: vf_odc_contents_carveout
  statement: ODC-By 1.0 states that it governs rights over the Database and not copyright or other independent rights
    in individual Contents; Section 2.4 specifically identifies copyright, data-protection, privacy, and personality
    rights as examples that may apply to individual Contents.
  source_ids:
  - odc_by_1_0_legal_code
  - zenodo_license_14498691
- statement_id: vf_odc_notices
  statement: ODC-By Sections 4.2 and 4.3 impose different notice paths for public conveyance of a database and public
    use of a Produced Work; Section 4.3 supplies an example database-origin notice.
  source_ids:
  - odc_by_1_0_legal_code
  - zenodo_license_14498691
- statement_id: vf_bonafide_provenance
  statement: The ASVspoof 5 design paper says the database is generated from MLS English; bona fide utterances are
    sourced directly from MLS English. OpenSLR identifies MLS as derived from LibriVox audiobooks and labels SLR94
    CC BY 4.0.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - asvspoof5_design_paper_hal_v1
  - openslr_mls_slr94
- statement_id: vf_librivox_source_policy
  statement: LibriVox states that volunteer recordings are donated to the public domain and may be reused, but its
    public-domain page limits certainty to the United States and warns users elsewhere to verify local status.
  source_ids:
  - librivox_about_recording
  - librivox_public_domain
- statement_id: vf_spoof_generation
  statement: The design paper says spoof utterances are generated by external contributors using distinct TTS and
    VC systems, with adversarial attacks in the evaluation set. The official README credits many contributors for
    creating spoofed data but does not state a separate content licence for spoofed audio.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - asvspoof5_design_paper_hal_v1
  - zenodo_readme_14498691
- statement_id: vf_external_attack_dependencies
  statement: The design paper says A17, A28, and A29 use off-the-shelf systems pre-trained on external datasets;
    it identifies A28 as a pre-trained Coqui YourTTS system and A29 as a pre-trained Coqui XTTS system. It also
    documents optional Common Voice 11 use for speaker-encoder training.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - asvspoof5_design_paper_hal_v1
  - asvspoof5_evaluation_plan_phase1_v0_2
- statement_id: vf_coqui_public_metadata
  statement: Pinned Coqui public metadata labels XTTS v1.1 and v2 as CPML and labels the YourTTS model as CC BY-NC-ND
    4.0. The pinned XTTS v2 CPML text expressly limits both the model and its outputs to non-commercial purposes
    and requires downstream recipients of output to receive the terms or their URL. These captures do not establish
    which exact versions, checkpoints, or separate licences the ASVspoof contributors used.
  source_ids:
  - coqui_tts_model_index
  - coqui_xtts_v2_license
  - coqui_xtts_v2_model_card
  - coqui_xtts_v2_api_metadata
- statement_id: vf_common_voice_2022_terms
  statement: The Mozilla legal documents in force by the Common Voice 11 release required contributors to dedicate
    contributions to CC0, assert that contributions were their own and non-infringing, and stated that voice recordings
    and optional demographics may be publicly available under CC0.
  source_ids:
  - common_voice_terms_2022_capture
  - common_voice_privacy_2022_capture
  - cc0_1_0_legal_code
- statement_id: vf_challenge_rules
  statement: The Phase 2 v0.6 plan defines challenge conditions and rules, including data-use restrictions, no pooling
    of training and development data, independent scoring of test samples, system-description duties, and ethics
    language. The Zenodo record recommends following the plan for comparability, but the public sources do not expressly
    classify every rule as binding on independent post-challenge research.
  source_ids:
  - asvspoof5_evaluation_plan_phase2_v0_6
  - zenodo_record_14498691_api
- statement_id: vf_public_attack_protocol_boundary
  statement: The design paper says attack-generation protocols are withheld for ethical reasons and are available
    only on request for detection research or other beneficial and harmless applications.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - asvspoof5_design_paper_hal_v1
  - zenodo_record_14498691_api
- statement_id: vf_privacy_and_ethics_notice
  statement: The official README directs users to comply with local data-protection law, act responsibly, disclose
    vulnerabilities responsibly, and avoid malicious use. The corpus metadata described in the README includes speaker
    identifiers and gender fields.
  source_ids:
  - zenodo_readme_14498691
  - asvspoof5_evaluation_plan_phase2_v0_6
component_assessments:
- component_id: database_structure
  role: Database arrangement, protocol metadata, and database rights
  status: partially_clarified
  evidence_summary: ODC-By is authoritatively attached to release v0.1 and its database-level terms and notice requirements
    are captured.
  unresolved_items: Qualified review must determine how ODC-By contract rights and Produced Work notices apply to
    the exact offline evaluation and publication workflow.
  source_ids:
  - zenodo_record_14498691_api
  - zenodo_readme_14498691
  - zenodo_license_14498691
  - odc_by_1_0_legal_code
- component_id: bonafide_audio
  role: Bona fide recordings in train, development, evaluation, and enrolment components
  status: partially_clarified
  evidence_summary: The release README expressly distributes bona fide data under CC BY 4.0. Public provenance traces
    it to MLS English (CC BY 4.0), derived from LibriVox recordings.
  unresolved_items: Qualified review must address licensor authority, attribution supplied with the material, LibriVox
    jurisdictional caveats, and privacy/personality/voice considerations not granted by CC BY. Maintainers should
    confirm that every bona fide and enrolment file is covered.
  source_ids:
  - zenodo_readme_14498691
  - cc_by_4_0_legal_code
  - openslr_mls_slr94
  - librivox_public_domain
  - asvspoof5_design_paper_arxiv_v4
- component_id: spoof_tts_vc_audio
  role: TTS and voice-conversion spoof audio
  status: unresolved
  evidence_summary: The design paper documents contributor-created spoof audio and source/adaptation flows, but
    the README grants a separate CC BY content licence only to bona fide data.
  unresolved_items: The public evidence does not identify a content-level licence, contributor assignment, or other
    rights basis for every spoof output. Exact contributor agreements and output rights require maintainer clarification.
  source_ids:
  - zenodo_readme_14498691
  - asvspoof5_design_paper_arxiv_v4
  - asvspoof5_design_paper_hal_v1
  - odc_by_1_0_legal_code
- component_id: adversarial_spoof_audio
  role: Adversarially filtered spoof audio
  status: unresolved
  evidence_summary: The paper describes adversarial filters applied to base spoof attacks in the evaluation set.
  unresolved_items: Rights in the base spoof outputs, adversarial transformations, contributor grants, and any model-output
    conditions are not publicly resolved.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - asvspoof5_design_paper_hal_v1
- component_id: mls_attack_inputs
  role: MLS training, adaptation, source-speech, target-speaker, and input-text components used for attack generation
  status: partially_clarified
  evidence_summary: The paper describes MLS English as the principal source, and OpenSLR labels MLS CC BY 4.0.
  unresolved_items: The exact attribution chain and whether all attack inputs were covered by the same MLS terms
    require confirmation, especially for attacks using external pre-trained systems.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - openslr_mls_slr94
  - cc_by_4_0_legal_code
- component_id: common_voice_dependency
  role: Optional Common Voice 11 data used to train speaker encoders
  status: partially_clarified
  evidence_summary: Historical Mozilla terms and privacy documentation support CC0 treatment and contributor assurances.
    Common Voice is documented as an optional indirect attack-model dependency, not a published ASVspoof audio component.
  unresolved_items: Public sources do not identify which attacks used Common Voice, the exact subset, or whether
    any access-time covenant or notice was intended to flow to generated outputs.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - asvspoof5_evaluation_plan_phase1_v0_2
  - common_voice_terms_2022_capture
  - common_voice_privacy_2022_capture
  - cc0_1_0_legal_code
- component_id: pretrained_attack_models
  role: Pre-trained attack models and their outputs, especially A28 YourTTS and A29 XTTS
  status: unresolved
  evidence_summary: Current pinned Coqui metadata documents restrictive model terms, and the XTTS v2 CPML expressly
    addresses outputs.
  unresolved_items: The exact versions, checkpoints, terms in force at generation, possible separate licences, notice
    compliance, and downstream status of included outputs are not public. A17 training datasets are also not exhaustively
    identified.
  source_ids:
  - asvspoof5_design_paper_arxiv_v4
  - coqui_tts_model_index
  - coqui_xtts_v2_license
  - coqui_xtts_v2_model_card
- component_id: challenge_and_access_layer
  role: Challenge participation rules versus current public post-challenge access
  status: unresolved
  evidence_summary: Current Zenodo access is direct and the record recommends the Phase 2 plan for comparable results.
    The plan also contains participant rules and historic registration/submission requirements.
  unresolved_items: Maintainers should distinguish rules that remain conditions of dataset use from rules that applied
    only to ranked 2024 participation or are now methodological recommendations.
  source_ids:
  - zenodo_record_14498691_api
  - asvspoof5_evaluation_plan_phase2_v0_6
- component_id: privacy_voice_personality
  role: Privacy, personality, publicity, voice, and data-protection interests
