# VoiceShield Rights-Aware Corpus Registry
# Schema Version 1.0.0
#
# This registry governs external speech corpora evaluated or considered for
# research, calibration, training, product use, and redistribution.
#
# Governance Lifecycle:
# 1. Registration and explicit rights review happen before acquisition.
# 2. Once rights review permits acquisition, acquire and immediately hash the exact archive.
# 3. Convert and hash the canonical manifest.
# 4. Mark the snapshot verified only after integrity metadata is complete.
# 5. Evaluation, calibration, training, product use, and redistribution require
#    successful purpose-specific authorization of a verified snapshot.
#
# Unreviewed/pending candidate corpora remain planned with conservative metadata
# (attribution_required: null, raw_redistribution_status: unknown, allowed_purposes: []).

